language_name: فارسی
is_enabled: true

move: |
  همهٔ قابلیت‌های اصلی مانند ساخت و ویرایش پست‌ها، مشاهدهٔ آمار و پست‌های زمان‌بندی‌شده به ربات‌های متصل منتقل شده‌اند، بنابراین دیگر نیازی نیست هر بار بین ربات خودتان و Controller Bot جابه‌جا شوید!

  به ربات متصل خود بروید و دستور /start را بفرستید.

common:
  open_webapp: "📱 باز کردن برنامه وب"
  choose_language: لطفاً زبان خود را انتخاب کنید.

  start: |
    من می‌توانم به شما در مدیریت کانال‌های تلگرام کمک کنم.

    با فرستادن این دستورها می‌توانید مرا کنترل کنید:

    /newpost - ساخت پست جدید

    /addchannel - افزودن کانال جدید
    /mychannels - ویرایش کانال‌های شما

    /settings - سایر تنظیمات

  help: |
    اگر سؤالی دارید، نگاهی به <a href="https://telegra.ph/Controller-Help-03-20">راهنمای Controller</a> بیندازید.

    با فرستادن این دستورها می‌توانید مرا کنترل کنید:

    /newpost - ساخت پست جدید
    /addchannel - افزودن کانال جدید
    /mychannels - ویرایش کانال‌های شما
    /settings - سایر تنظیمات
    /lang - تغییر زبان

bots:
  add: |
    <b>اتصال ربات</b>

    برای اتصال یک ربات، این دو مرحله را دنبال کنید:

    1. @BotFather را باز کنید و <a href="https://telegra.ph/Create-Bot-Controller-FAQ-03-28">یک ربات جدید بسازید</a>.
    2. یک توکن دریافت می‌کنید (مثلاً 12345:6789ABCDEF) — فقط آن را برای من فوروارد کنید یا کپی-پیست کنید.

    <b>هشدار!</b> ربات‌هایی را که قبلاً توسط سرویس‌های دیگری مثل Chatfuel، Manybot و غیره استفاده شده‌اند، متصل نکنید.

  auto_button: "🤖 ساخت خودکار ربات"
  auto_created: "✅ ربات ساخته شد و متصل شد:"
  wrong_token: این برای من معنی‌ای ندارد. لطفاً توکن ربات خود را برایم بفرستید.
  error_add: توکن نامعتبر است. یک توکن جدید بگیرید یا از توکن ربات دیگری استفاده کنید.
  bot_already_added: برایم آشناست. این ربات قبلاً متصل شده است.

channels:
  welcome: |
    <b>مدیریت کانال‌ها</b>

    ${count
      ? 'کانالی را از فهرست زیر انتخاب کنید:'
      : 'هنوز هیچ کانالی افزوده نشده است.'
    }
  add:
    select_bot: |
      رباتی را انتخاب کنید که برای ارسال پست‌ها در کانال استفاده می‌شود.
    welcome: |
      <b>افزودن کانال</b>

      برای افزودن کانال، این دو مرحله را دنبال کنید:

      1. <a href="https://telegra.ph/Add-Bot-to-Admins-Controller-FAQ-03-28">@${username} را به مدیران کانال خود اضافه کنید</a>.
      2. سپس هر پیامی از کانال خود را برای من فوروارد کنید (می‌توانید نام کاربری یا شناسهٔ آن را هم بفرستید).
    added: |
      موفق! کانال ${channel.username ? '<a href="https://t.me/' + channel.username + '">' + channel.name + '</a>' : '<b>' + channel.name + '</b>'} افزوده شد.

      برای ساخت پست جدید به @${bot_username} بروید.

      همهٔ مدیران کانال شما هم می‌توانند از این ربات برای ساخت پست در این کانال استفاده کنند.

      اگر مدیر جدیدی اضافه کردید، به تنظیمات کانال بروید و «به‌روزرسانی داده‌ها» را انتخاب کنید تا فهرست مدیران به‌روز شود.

    error:
      data: |
        لطفاً هر پیامی از کانال خود را برای من فوروارد کنید، یا نام کاربری یا شناسهٔ آن را بفرستید.
      channel_not_found: کانال پیدا نشد.
      you_are_not_administrator: شما مدیر این کانال نیستید.
      you_do_not_have_rights: شما اجازهٔ ارسال پیام در این کانال را ندارید.
      bot_is_not_admin: '@${username} را به مدیران کانال خود اضافه کنید. لطفاً همه‌چیز را دوباره بررسی کنید و دوباره تلاش کنید.'
      bot_is_not_admin_in_group: '@${username} را به مدیران گروه خود اضافه کنید و دوباره تلاش کنید.'
      bot_was_deleted: |
        افزودن کانال ممکن نیست. @${username} دیگر وجود ندارد یا توکن آن لغو شده است. این ربات را دوباره متصل کنید یا ربات دیگری انتخاب کنید.
      channel_already_added: این کانال قبلاً افزوده شده است. برای ساخت پست جدید به @${bot_username} بروید.
      group_already_added: |
        این کانال قبلاً توسط ${admin.first_name}${admin.last_name ? ' ' + admin.last_name : ''}${admin.username ? ' @' + admin.username : ''} افزوده شده است

  control:
    options: |
      بفرمایید: ${channel.name}. می‌خواهید با این کانال چه کار کنید؟
    delete_confirm: |
      مطمئنید که می‌خواهید این کانال را حذف کنید؟

      همهٔ پست‌های زمان‌بندی‌شده و آمارهای ذخیره‌شدهٔ این کانال هم حذف خواهند شد.
    channel_deleted: انجام شد! کانال حذف شد.
    select_bot: |
      ${count
        ? 'ربات مورد نظر را برای ارسال پست‌ها در کانال انتخاب کنید.'
        : 'هنوز هیچ رباتی متصل نشده است. برای اتصال ربات جدید /addchannel را بفرستید.'
      }
    bot_is_not_admin: ربات را به مدیران کانال خود اضافه کنید.
    current_bot: انتخاب رباتی که هم‌اکنون استفاده می‌شود ممکن نیست.
    sync_ok: 👌 باشه. داده‌ها همگام‌سازی شد.
    set_timezone: |
      <b>تنظیم منطقهٔ زمانی</b>

      نام شهر خود را بفرستید تا منطقهٔ زمانی تنظیم شود. این لازم است تا پست‌های زمان‌بندی‌شده دقیقاً سر وقت بر اساس زمان محلی شما منتشر شوند.

      همچنین می‌توانید موقعیت مکانی خود را برای ربات بفرستید تا نزدیک‌ترین شهر به شما را پیدا کند و منطقهٔ زمانی بر اساس آن تنظیم شود.
    timezone: |
      منطقهٔ زمانی فعلی:
      ${city ? '🔹 GMT ' + (gmt > 0 ? '+' + gmt : gmt) + '\n🔹 ' + timezone_id + ' – ' + city : '🔹 تنظیم نشده'}

      نام شهری نزدیک به خود را بفرستید تا منطقهٔ زمانی تغییر کند.
      یا موقعیت مکانی خود را برای ربات بفرستید تا نزدیک‌ترین شهر را پیدا کند و منطقهٔ زمانی بر اساس آن تنظیم شود.
    check_timezone: |
      · GMT ${timezone.gmtOffset > 0 ? '+' + timezone.gmtOffset : timezone.gmtOffset} (${timezone.timeZoneId})
      · ${countryName}، ${name}

      برای تغییر منطقهٔ زمانی، نام شهر خود را بفرستید.
      یا موقعیت مکانی خود را برای ربات بفرستید تا نزدیک‌ترین شهر را برای تنظیم منطقهٔ زمانی پیدا کند.

      درست است؟ اگر نه، نام شهر بزرگ دیگری نزدیک به خود را وارد کنید.
    select_nearest: |
      نزدیک‌ترین شهر را انتخاب کنید.
    error_timezone: متأسفم، این شهر را پیدا نکردم. نام شهر دیگری نزدیک به خود را بفرستید.
    error_request_timezone: مشکلی پیش آمد :( لطفاً دوباره تلاش کنید. اگر تغییری نکرد، به @ControllerSupportBot پیام بدهید.
    save_timezone: باشه، منطقهٔ زمانی شما ذخیره شد.

post:
  select_channel: کانالی را برای ساخت پست جدید انتخاب کنید.
  no_channels: |
    هنوز هیچ کانالی افزوده نشده است.

    برای افزودن کانال جدید /addchannel را بفرستید.
  error_check_channel: مشکلی پیش آمد :( لطفاً دوباره تلاش کنید. اگر تغییری نکرد، به @ControllerSupportBot پیام بدهید.
  channel_not_found: این کانال وجود ندارد یا شما به آن دسترسی ندارید. به @ControllerBot برگردید و دوباره تلاش کنید.
  problems: |
    ساخت پست جدید در ${channel.name} ممکن نیست. این مشکلات پیدا شدند:

    ${problems}

    ${from.id == channel.owner_id
      ? 'برای رفع مشکلات به تنظیمات کانال بروید.'
      : 'سازندهٔ کانال باید به تنظیمات کانال برود و مشکلات را رفع کند.'
    }
  problem_items:
    timezone_is_not_set: 🔹 منطقهٔ زمانی تنظیم نشده است
    bot_is_not_connection: 🔹 کانال به هیچ رباتی متصل نیست
    channel_not_found: 🔹 کانال دیگر وجود ندارد
    bot_is_not_admin: 🔹 ربات متصل به مدیران کانال اضافه نشده است
    bot_was_deleted: 🔹 ربات متصل دیگر وجود ندارد یا توکن آن لغو شده است

  start: |
    برای اتصال کانال جدید و شروع ساخت پست‌ها به @ControllerBot بروید.

  make:
    set_formatting: |
      ابتدا باید سبک قالب‌بندی پیش‌فرض را انتخاب کنید.

      برای دیدن راهنما /markdown یا /HTML را بفرستید.

      بیشتر کاربران Markdown را ترجیح می‌دهند چون کوتاه‌تر و ساده‌تر است. قالب‌بندی بومی هم مجاز است.
    start: |
      بفرمایید: <b>"${channel.name}"</b>${channel.username ? ' @' + channel.username : ''}.

      یک یا چند پیامی را که می‌خواهید در پست باشد برای من بفرستید. هر چیزی می‌شود — متن، عکس، ویدیو، حتی استیکر.
    clear: موفق! همهٔ پیام‌ها حذف شدند.
    message_deleted: انجام شد! پیام حذف شد.
    not_posts: هنوز هیچ پیامی وجود ندارد.
    not_posts_for_done: هنوز هیچ پیامی وجود ندارد.
    preview_sent: |
      پیش‌نمایش پست در بالا ارسال شد.

      شما <b>${pluralize(posts, 'پیام', 'پیام‌ها', 'پیام‌ها')}</b> در این پست دارید:
      ${messages}
    error_poll_not_anonymous: متأسفم، اما ارسال نظرسنجی غیرناشناس به کانال‌ها ممکن نیست.
    error_parse: |
      خطاهای قالب‌بندی متن:

      <pre>${description}</pre>

      لطفاً <a href="https://telegra.ph/Parsing-Error-Fix-Controller-FAQ-03-28">همهٔ خطاها را رفع کنید</a> و پیام را دوباره بفرستید.
    continue_collect: می‌توانید ارسال پیام‌ها را ادامه دهید.
    html: |
      <b>پررنگ</b>
      &lt;b&gt;پررنگ&lt;/b&gt;

      <i>مورب</i>
      &lt;i&gt;مورب&lt;/i&gt;

      <a href="http://www.example.com/">پیوند درون‌خطی</a>
      &lt;a href=&quot;http://www.example.com/&quot;&gt;پیوند درون‌خطی&lt;/a&gt;

      <code>کد هم‌عرض درون‌خطی</code>
      &lt;code&gt;کد هم‌عرض درون‌خطی&lt;/code&gt;

      <pre>بلوک کد هم‌عرض پیش‌قالب‌بندی‌شده</pre>
      &lt;pre&gt;بلوک کد هم‌عرض
      پیش‌قالب‌بندی‌شده&lt;/pre&gt;
    markdown: |
      <b>متن پررنگ</b>
      *متن پررنگ*

      <i>متن مورب</i>
      _متن مورب_

      <a href="http://www.example.com/">متن</a>
      [متن](http://www.example.com/)

      <code>کد هم‌عرض درون‌خطی</code>
      `کد هم‌عرض درون‌خطی`

      <pre>متن
      بلوک کد هم‌عرض پیش‌قالب‌بندی‌شده</pre>
      ```بلوک کد هم‌عرض
      پیش‌قالب‌بندی‌شده
      ```
    canceled: ساخت پست لغو شد.
    inline:
      welcome: |
        فهرست دکمه‌های URL را برایم بفرستید. لطفاً از این قالب استفاده کنید:
        <pre>متن دکمه 1 - http://www.example.com/ | متن دکمه 2 - http://www.example2.com/
        متن دکمه 3 - http://www.example3.com/
        </pre>
        
        همچنین می‌توانید رنگ دلخواه دکمه را اضافه کنید:
        <pre>
        دکمه 1 - http://example1.com - style:green
        دکمه 2 - http://example2.com - style:blue
        دکمه 3 - http://example3.com - style:red
        </pre>
        
        برای افزودن تا سه دکمه در یک ردیف از جداکنندهٔ <b>|</b> استفاده کنید. مثال:
        <pre>
        دکمه 1 - http://example1.com | دکمه 2 - http://example2.com
        دکمه 3 - http://example3.com - style:red | دکمه 4 - http://example4.com
        </pre>
        
        ${current ? '\nدکمه‌های فعلی:\n' + current : ''}

        برای بازگشت به ساخت پست، «لغو» را انتخاب کنید.
      error: |
        خطاها در فهرست دکمه‌های URL: <code>${error}</code>

        لطفاً همهٔ خطاها را رفع کنید و پیام را دوباره بفرستید.
      not_keyboard: |
        پیامی که فرستادید با قالب فهرست دکمه‌های URL مطابقت ندارد. لطفاً دوباره بررسی کنید و دوباره تلاش کنید.
      save: دکمه‌های URL ذخیره شدند. می‌توانید ارسال پیام‌ها را ادامه دهید.
      cleared: موفق! دکمه‌های URL پاک شدند.
    reactions:
      welcome: |
        <a href="https://telegra.ph/file/dd1fcbdd1ebb1ce76ab59.jpg">&#8203;</a>برای افزودن واکنش‌ها، ایموجی یا متنی با جداکنندهٔ <b>/</b> برایم بفرستید.

        مثلاً:
      not_found_smiles: |
        یک یا چند ایموجی برایم بفرستید. مثلاً: 👍👎
      save: واکنش‌ها ذخیره شدند. می‌توانید ارسال پیام‌ها را ادامه دهید.
      cleared: موفق! واکنش‌ها پاک شدند.
      notify: شمارنده‌ها پس از ارسال در دسترس خواهند بود.
      default_reactions:
        welcome: |
          می‌توانید واکنش‌هایی تعیین کنید که به‌طور خودکار به پیام‌های پست‌های جدید اضافه می‌شوند. یک یا چند ایموجی برایم بفرستید. مثلاً: 👍👎

          ${reactions.length ? 'واکنش‌های پیش‌فرض فعلی: ' + reactions.join(' ') : ''}
        saved: واکنش‌های پیش‌فرض ذخیره شدند.
        deleted: واکنش‌های پیش‌فرض غیرفعال شدند.
        canceled: تنظیم واکنش‌های پیش‌فرض لغو شد.
    image:
      welcome: |
        عکسی بفرستید تا به‌عنوان پیش‌نمایش پیوند ضمیمه شود.
      only_link_or_photo: عکس یا پیوند بفرستید.
      error: |
        هنگام بارگذاری خطایی رخ داد.

        برای گزارش مشکل به @ControllerSupportBot پیام بدهید.
      save: عکس ضمیمه شد.
      cleared: عکس ضمیمه حذف شد.

  send:
    count_posts: |
      ${pluralize(count, 'پیام', 'پیام‌ها', 'پیام‌ها')} آمادهٔ ارسال به <b>${channel.name}</b>${channel.username ? ' @' + channel.username : ''}.
    choose_type: پست را چه زمانی ارسال کنم؟
    problems: |
      ساخت پست جدید در ${channel.name} ممکن نیست. این مشکلات پیدا شدند:

      ${problems}

      ${from.id == channel.owner_id
        ? 'برای رفع مشکلات به تنظیمات کانال بروید.'
        : 'سازندهٔ کانال باید به تنظیمات کانال برود و مشکلات را رفع کند.'
      }
    cancel_send: ارسال پست لغو شد.
    continue_send: می‌توانید ارسال پیام‌ها را ادامه دهید.
    confirm_send: >
      مطمئنید که می‌خواهید <b>${pluralize(posts, 'پیام', 'پیام‌ها', 'پیام‌ها')}</b> را به
      <b>${channel.name}</b>${channel.username ? ' @' + channel.username : ''} ارسال کنید؟
    waiting: 🕒 در حال ارسال...
    ok: انجام شد!

  schedule:
    day:
      today: امروز
      tomorrow: فردا
      after_tomorrow: پس‌فردا
    welcome: |
      ساعتی را که می‌خواهید پست ${day} ارسال شود بفرستید.
      برای زمان‌بندی در هر روز دیگری، ساعت+تاریخ بفرستید.

    help: |
      <b>این قالب‌های ساعت پشتیبانی می‌شوند:</b>
      <pre>"6" → 06:00
      "5 3" → 05:03
      "15:30" → 15:30
      "1530" → 15:30</pre>

      <b>این قالب‌های تاریخ پشتیبانی می‌شوند:</b>
      <pre>"6" → ۶م ماه جاری
      "9 12" → ۹ دسامبر
      "8 7 18" → ۸ ژوئیهٔ ۲۰۱۸</pre>

      برای جدا کردن اجزا می‌توانید به‌جای فاصله از دونقطه یا نقطه استفاده کنید.

      اگر فقط ساعت بفرستید، پست به‌طور پیش‌فرض برای امروز زمان‌بندی می‌شود. برای هر روز دیگری ساعت+تاریخ بفرستید. مثال: <code>16 30 6 8 -> 16:30، ۶ اوت</code>
    error_date: تاریخ یا ساعت نادرست است. برای دیدن راهنما «پشتیبانی» را انتخاب کنید.
    invalid_date: تاریخ نادرست است.
    limit: باید زمانی حداقل ۱ دقیقه بعد از زمان فعلی انتخاب کنید. تاریخ و ساعت فعلی ${current_date} است.
    limit_year: 'انتخاب زمانی بیش از یک سال در آینده ممکن نیست. کسی چه می‌داند تا آن موقع چه می‌شود... :)'
    ok: |
