language_name: Русский
is_enabled: true

move: |
  Все основные функции, такие как создание и редактирование постов, просмотр статистики и отложенных постов были перемещены в подключенные боты, чтобы избавить вас от необходимости постоянно переключаться между вашим ботом и Controller Bot.

  Перейдите в свой подключенный бот и отправьте команду /start.

common:
  choose_language: Выберите язык.

  start: |
    Каждый день я помогаю администраторам 650 000 телеграм каналов создавать красивые посты с реакциями и комментариями, организую контент планы, платные подписки на приватные каналы и многое другое. 

    /newpost - Создать пост

    /addchannel - Добавить канал
    /subcontrol - Платные подписки
    /mysubs - Плантые каналы, на которые Вы подписаны
    /mychannels - Управление каналами

    /settings - Настройки бота

  help: |
    Изучите <a href="https://telegra.ph/Controller-Help-03-22">справку</a>, если вам нужна помощь или обратитесь в <a href="https://t.me/ControllerSupportBot">техподдержку</a>, если не нашли ответа на свой вопрос в справке.

    /newpost - создать пост
    /addchannel - добавить канал
    /mychannels - управление каналами
    /settings - настройки
    /lang - изменить язык

bots:
  add: |
    <b>Подключение бота</b>

    Чтобы подключить бот, вам нужно выполнить два действия:

    <b>Важно:</b> не подключайте боты, которые используются в других сервисах (Livegram, Manybot, Chatfuel и другие).

    1. Перейдите в бот @BotFather и создайте новый бот.
    2. После создания бота вы получите токен бота (выглядит вот так – <code>123456:ABC-DEF1234gh...</code>) – скопируйте его или перешлите сообщение с ним сюда.

  wrong_token: Некорректный токен бота. Токен бота выглядит вот так – <code>123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11</code>.
  error_add: Такого бота не существует. Пришлите токен другого бота.
  bot_already_added: Этот бот уже подключен к @ControllerBot.

channels:
  welcome: |
    <b>Управление каналами</b>

    ${count
      ? 'Выберите канал из списка ниже:'
      : 'Вы не добавили ни одного канала.'
    }
  add:
    select_bot: |
      Выберите бот, через который хотите публиковать посты в канале.
    welcome: |
      <b>Добавление канала</b>

      Чтобы добавить канал, вы должны выполнить два следующих шага:

      1. Добавьте @${username} в администраторы вашего канала.
      2. Перешлите мне любое сообщение из вашего канала (вы также можете отправить @username или <a href="https://telegra.ph/How-to-add-a-chat-Controller-FAQ-10-12">Group ID</a>).
    added: |
      Канал ${channel.username ? '<a href="https://t.me/' + channel.username + '">' + channel.name + '</a>' : '<b>' + channel.name + '</b>'} успешно добавлен.

      Перейдите в @${bot_username}, чтобы создать новый пост.

      Все администраторы вашего канала также могут использовать бот для создания постов в этот канал.

      Если в будущем вы добавите нового администратора, то перейдите в настройки канала в боте и нажмите кнопку «Обновить данные», чтобы синхронизовать список администраторов.

    error:
      data: |
        Перешлите мне любое сообщение из вашего канала (вы также можете отправить @username или <a href="https://telegra.ph/How-to-add-a-chat-Controller-FAQ-10-12">Group ID</a>).
      channel_not_found: Канал не найден.
      you_are_not_administrator: Вы не являетесь администратором этого канала.
      you_do_not_have_rights: Вы не имеете прав на постинг сообщений в этот канал.
      bot_is_not_admin: Бот не является администратором этого канала.
      bot_is_not_admin_in_group: |
        Бот @${username} должен быть администратором супергруппы. Добавьте бот в администраторы группы и повторите попытку.
      bot_was_deleted: |
        Добавить канал невозможно, потому что вы удалили ваш бот @${username} из @BotFather или изменили его token.

        Выберите другой бот или добавьте новый.
      channel_already_added: Этот канал уже добавлен. Перейдите в @${bot_username}, чтобы создать новый пост.
      group_already_added: |
        Этот канал уже добавлен в @ControllerBot другим администратором – ${admin.first_name}${admin.last_name ? ' ' + admin.last_name : ''}${admin.username ? ' @' + admin.username : ''}

  control:
    options: |
      Вы выбрали канал «${channel.name}». Что вы хотите сделать с этим каналом?
    delete_confirm: |
      Будут удалены все созданные отложенные посты в этот канал.

      Вы уверены, что хотите удалить канал?
    channel_deleted: Канал удален.
    select_bot: |
      ${count
        ? 'Выберите бот, который вы хотите использовать для постинга в выбранном канале.'
        : 'У вас нет подключенных ботов. Перейдите в добавление каналов, чтобы подключить бот.'
      }
    bot_is_not_admin: Добавьте этот бот в администраторы канала.
    current_bot: Нельзя выбрать активный бот.
    sync_ok: 👌 Данные канала синхронизованы.
    set_timezone: |
      <b>Настройка таймзоны</b>

      Пришлите название Вашего города, чтобы установить часовой пояс. Это необходимо, чтобы отложенные посты выходили точно в срок по Вашему местному времени.
      Также Вы можете отправить боту гелокацию, чтобы он попытался найти ближайший к Вам город, по которому будет выставлена временная зона.
    timezone: |
      Текущий часовой пояс:
      ${city ? '🔹 GMT ' + (gmt > 0 ? '+' + gmt : gmt) + '\n🔹 ' + timezone_id + ' – ' + city : '🔹 не указан'}

      Отправьте название вашего города, чтобы изменить часовой пояс.
      Или Вы можете отправить боту гелокацию, чтобы он попытался найти ближайший к Вам город, по которому будет выставлена временная зона.
    check_timezone: |
      · GMT ${timezone.gmtOffset > 0 ? '+' + timezone.gmtOffset : timezone.gmtOffset} (${timezone.timeZoneId})
      · ${countryName}, ${name}

      Чтобы изменить часовой пояс, отправьте название Вашего города.
      Или Вы можете отправить боту гелокацию, чтобы он попытался найти ближайший к Вам город, по которому будет выставлена временная зона.
      
      Верно? Если нет — попробуйте ввести другой ближайший к Вам крупный город.
    select_nearest: |
      Выберите ближайший город.
    error_timezone: Не можем найти такой город. Попробуйте ввести другой ближайший к вам город.
    error_request_timezone: Что-то пошло не так :( Повторите попытку установки временной зоны позже или напишите нам в @ControllerSupportBot, если проблема сохраняется.
    save_timezone: Часовой пояс сохранен.
    link_chat: |-
      Вы должны привязать discussion group Контроллер боту чтобы подключить нативные комментарии.
      
      Следуйте инструкциям:
      https://telegra.ph/How-to-link-the-discussion-group-to-Controller-bot-Controller-FAQ-08-18

    chatIsNotLinked: |-
      Этот чат не прилинкован к каналу

  subscription:
    channels_with_unavailable_subscription: |
      Каналы, на которых подписка не настроена.
    channels_with_available_subscription: |
      Каналы, на которых настроена подписка. 
      *ВНИМАНИЕ*
      В данный момент платежи принимаются только из СНГ
    subscription_not_configured: |
      У Вас еще нет каналов с платной подпиской.
      *ВНИМАНИЕ* 
      В данный момент платежи принимаются только из СНГ
    enter_channel_description: |
      Пришлите короткое описание канала/группы. Его увидят Ваши потенциальные подписчики перед покупкой подписки. ${ description ? ' Отправьте "-", чтобы использовать стандартное описание (' + description + ')' : ''}
      
      Если описание будет больше 3793 символов, то оно будет обрезано.
    settings_complete: Базовая настройка завершена, теперь нужно создать/отредактировать тарифы
    list_tariffs: Выберите из списка тариф, который хотите отредактировать
    current_tariffs: |
      Текущий список тарифов:
    enter_tariff_name: |
      Напишите название тарифа или отправьте "-", чтобы оставить его пустым. ${name ? 'Текущее название: ' + name : ''}
      
      Название может быть обрезано, если оно будет длиннее 20-ти символов.
      Мы берём комиссию ~10% с каждого пополнения.
    enter_tariff_currency: |
      Выберите валюту. ${currency ? 'Текущая валюта: ' + currency : ''}
    enter_tariff_period: |
      Укажите период действия тарифа. ${period ? 'Текущий период: ' + period : ''}
    enter_tariff_price: |
      Укажите цену данного тарифа. (Валюта: ${currency}, Период: ${localizedPeriod} )${price ? 'Текущая цена: ' + price + ' ' + currency : ''}
      Минимальная цена: ${minimum} ${currency}
    tariff_complete: Тариф успешно создан!
    manage_tariff: Управление тарифом "${name}"
    start_subscription_process: |
      Подписка на канал/группу: *${name}*

      ${description}

      Подписаться?
      ${photo ? '[\u200B](' + photo + ')' : '' }
    select_tariff: Выберите тариф
    confirm_delete_tariff: Уверены что хотите удалить тариф?
    subscription_increased: |
      Текущая подписка продлена до *${date}*.

      Перейдите [по ссылке](${link}) чтобы присоединиться к каналу
    subscription_created: |
      Подписка оформлена до
      *${date}*.

      Перейдите [по ссылке](${link}), чтобы вступить в приватный канал/группу
    payment_link_created: |
      Ссылка на оплату: ${link}
    list: |
      Список активных подписок:

      Оплачена до  -  Канал
      ${list}
    select_currency_for_withdraw: |
      Выберите валюту для снятия. Максимально можно вывести около 30 000 рублей за раз.
      
      *ВНИМАНИЕ!* В некоторых случаях вывод возможен только спустя 24 часа с момента зачисления!
    enter_amount_for_withdraw: |
      Введите сумму снятия
    withdraw_link_created: |
      Ссылка на снятие успешно создана.
      Она будет активна в течение 24 часов.

      Ссылка: ${link}
    subscription_closely_expired:
      Подписка на канал/группу (${channelName}) завтра закончится. Хотите обновить её?
    total_statistics: |
      Статистика по каналу/группе *${channelName}* за *${month}*

      Общая:
      Всего подписчиков: *${totalSubscribersCount}*
      Новых подписчиков: *${newSubscribersCount}*
      Подписчиков, которые обновили подписку: *${renewSubscribersCount}*
      Кикнуто подписчиков: *${kickedUsersCount}*
      Приглашённых по ссылкам: *${entrancesCount}*
      Конверсия: *${conversion}*
    tagged_statistics: |
      Тег: *${tagName}*
      Всего подписчиков: *${totalSubscribersCount}*
      Новых подписчиков: *${newSubscribersCount}*
      Подписчиков, которые обновили подписку: *${renewSubscribersCount}*
      Кикнуто подписчиков: *${kickedUsersCount}*
      Приглашённых по ссылкам: *${entrancesCount}*
      Конверсия: *${conversion}*
    last_tariff_no_enable_for_delete: |
      Невозможно удалить последний тариф
    no_have_subscriptions: |
      На текущий момент у Вас нет подписок
    no_funds_on_balances: |
      На Вашем балансе недостаточно средств для вывода.
    attach_photo: |
      К описанию канала можно добавить изображение. Пришлите файл, либо "-", если Вы не хотите добавлять или изменять изображение.
      ${ photo ? 'Выбранная картинка: ' + photo : ''}
    create_subscription_link: |
      Для создания ссылки придумайте тег.
      
      В качестве тега можно использовать наименование платформы, на которой Вы хотите разместить ссылку для платной подписки на Ваш канал, либо любой другой признак, который поможет Вам отличить эту ссылку от других, когда их будет несколько.

      Например: “Реклама в канале ХХ”, “Тест ХХ - 13.08.1941”
    confirm_create_subscription_link: |
      Вы действительно хотите создать ссылку с тэгом (${tag})?
    no_have_subscription_link: |
      У Вас нет ссылок на подписки
    choose_language: |
      Укажите язык канала/группы. Выбранный язык будет использован для уведомления подписчиков о близости срока истечения подписки.
    regenerated_link: |
      Перейдите [по ссылке](${link}), чтобы вступить в приватный канал/группу
    periods:
      daily: День
      weekly: Неделя
      monthly: Месяц
      monthly_3: 3 месяца
      monthly_6: 6 месяцев
      yearly: Год
      yearly_2: 2 года
      yearly_3: 3 года
    subcontrol_description: |
      Контроллер бот открывает новые пути для монетизации Ваших каналов!

      Мы видим что авторы уникального контента все чаще смотрят в сторону его распространения через приватные Telegram каналы, подписка на которые осуществляется на платной основе. И мы чувствуем их “боль”, вызванную каждодневной актуализацией списка оплативших подписку.

      Ручная модерация в прошлом - встречайте функцию платных подписок от @ControllerBot!
      
      *Выполните 3 простых шага:*
      1. Активируйте функцию на Вашем приватном канале
      2. Настройте по подробной инструкции “бота-дворецкого”, который будет встречать потенциальных подписичков, и предлагать им Ваши тарифы
      3. Передайте ссылку на “бота-дворецкого” своей аудитории

      *А остальное мы возмем на себя:*
      1. Прием платежей за подписку
      2. Добавление оплативших подписчиков в канал
      3. Напоминания о близости срока окончания подписки
      4. Исключение не продливших подписку пользователей
    first_link_text: |
      Тарифы созданы, настройка канала завершена \- пора приступать к привлечению аудитории! 

      *Купить подписку на Ваш канал можно* [по ссылке](${link})

      _Совет: Если у Вас есть несколько разных источников трафка, можно создать дополнительные ссылки, и наблюдать за их статистикой в отдельности. Это поможет понять какой из источников работает лучше_
    list_balances: |
      *ВНИМАНИЕ!* В некоторых случаях вывод возможен только спустя 24 часа с момента зачисления!
      Мы берём комиссию ~10% с каждого пополнения.
      
      ${balances}
    errors:
      unavailable_delete_all_tariffs: ❌ Нельзя удалить все тарифы
      feature_disabled: Эта функция временно отключена. Выполните команду /start для возврата в основное меню.
      not_found_channel: Канал не найден
      tariff_already_exists: Тариф для периода (${localizedPeriod}) уже существует.
      payment_error: Ошибка платежа
      insufficient_funds: Недостаточно средств
      invalid_amount: |
        Неверная сумма. 
        Минимум: ${minimumAmount} ${currency}
        Максимум: ${maximumAmount} ${currency}
      not_found_tariff: Тариф не найден
      empty_price: Не указана цена
      empty_currency: Не задана валюта
      invalid_text: Ошибка в тексте
      only_private_channel: Только приватные каналы и группы могут иметь приватную подписку!
      unknown_error: |
        Обнаружена ошибка. ${code ? '(Код: ' + code +')' : ''}
        
        Сообщите об этом в @ControllerSupportBot. Напишите /start, чтобы попробовать снова.
post:
  select_channel: Выберите канал, в который вы хотите создать пост.
  no_channels: |
    Вы не добавили ни одного канала.

    Используйте команду /add, чтобы добавить свой первый канал.
  error_check_channel: Что-то пошло не так :( Сообщите нам в @ControllerSupportBot.
  channel_not_found: Канал не найден, либо у вас нет доступа. Вернитесь в @ControllerBot и выберите канал для создания поста.
  problems: |
    <b>Создать пост в канал «${channel.name}» невозможно</b> – обнаруженные проблемы:

    ${problems}

    ${from.id == channel.owner_id
      ? 'Перейдите в управление канала и исправьте проблемы.'
      : 'Так как вы администратор канала – уведомите создателя о проблемах.'
    }
  problem_items:
    timezone_is_not_set: 🔹 не установлена временная зона
    bot_is_not_connection: 🔹 не подключен бот к каналу
    channel_not_found: 🔹 канал не найден
    bot_is_not_admin: 🔹 бот не является администратором канала
    bot_was_deleted: 🔹 изменен токен бота, либо бот удален из @BotFather

  start: |
    Перейдите в бот @ControllerBot, чтобы добавить канал и начать создавать посты.

  make:
    set_formatting: |
      Для начала, необходимо настроить форматирование, которое будет использоваться по умолчанию при создании постов.

      Отправьте /markdown или /HTML, чтобы получить подсказку.

      Чаще всего пользователи используют Markdown, потому он короче и проще. Наш бот также поддерживает и нативное форматирование.
    start: |
      Вы выбрали канал <b>«${channel.name}»</b>${channel.username ? ' @' + channel.username : ''} для создания поста.

      Отправьте боту то, что хотите опубликовать. Это может быть всё, что угодно – текст, фото, видео, даже стикеры.
    clear: Сообщения удалены.
    message_deleted: Сообщение удалено.
    not_posts: Нет сообщений для предпросмотра.
    not_posts_for_done: Нет сообщений для постинга.
    preview_sent: |
      Сообщения для предпросмотра отправлены.

      В посте <b>${pluralize(posts, 'сообщение', 'сообщения', 'сообщений')}</b>:
      ${messages}
    error_poll_not_anonymous: Извините, но не-анонимные опросы недоступны для отправки в каналы.
    error_parse: |
      Обнаружены ошибки в форматировании:

      <pre>${description}</pre>

      Исправьте их и отправьте сообщение еще раз.

      <a href="https://telegra.ph/Parsing-Error-Fix-Controller-FAQ-03-22">Как исправить эту ошибку?</a>
    continue_collect: Продолжайте отправлять сообщения.
    html: |
      <b>жирный</b>
      &lt;b&gt;жирный&lt;/b&gt;

      <i>курсив</i>
      &lt;i&gt;курсив&lt;/i&gt;

      <a href="http://www.example.com/">название URL</a>
      &lt;a href=&quot;http://www.example.com/&quot;&gt;название URL&lt;/a&gt;

      <code>код в виде строки</code>
      &lt;code&gt;код в виде строки&lt;/code&gt;

      <pre>код
      в виде блока</pre>
      &lt;pre&gt;код
      в виде блока&lt;/pre&gt;
    markdown: |
      <b>жирный</b>
      *жирный*

      <i>курсив</i>
      _курсив_

      <a href="http://www.example.com/">название URL</a>
      [название URL](http://www.example.com/)

      <code>код в виде строки</code>
      `код в виде строки`

